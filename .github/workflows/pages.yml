name: Pages

# Publishes julioliolio.github.io/convertr/:
#   /      → docs/ (download page)
#   /app/  → the in-browser version (`npm run build:web`)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'static/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts skips the Electron / ffmpeg-static binary downloads,
      # which the web build doesn't use.
      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build web app
        run: npm run build:web

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          cp -r dist-web _site/app

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
